<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLM | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
  <div class="login-card">
    <div class="fake-logo">GLM</div>
    <p class="eyebrow">GERMAN LUXURY MOTORS</p>
    <h1>Welcome to the world of luxury.</h1>
    <p class="muted">Enter your information to enter the showroom.</p>

    <form onsubmit="loginUser(event)">
      <label for="name">Full Name</label>
      <input id="name" class="form-control luxury-input" type="text" placeholder="Kirolos Wael" required>

      <label for="email">Email Address</label>
      <input id="email" class="form-control luxury-input" type="email" placeholder="name@example.com" required>

      <button class="btn luxury-btn w-100 mt-3" type="submit">
        Enter Showroom <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <p class="small-note"><i class="bi bi-shield-check"></i> Demo login for the school project</p>
  </div>
  <script src="script.js"></script>
</body>

</html>
